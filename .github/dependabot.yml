version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directories:
      - "/styles"
      - "/bundles/browser"
      - "/bundles/server"
      - "/bundles/electron/frontend"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Separate entry so the deliberate better-sqlite3 pin can be ignored:
  # its version and electron ABI must match the prebuild that
  # bundles/electron/prebuild-node-modules.sh downloads; bump all three together.
  - package-ecosystem: npm
    directory: "/bundles/electron/backend"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: better-sqlite3
